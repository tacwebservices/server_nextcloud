#
# MyStickCloud server: stable Nextcloud release with the MyStickCloud theme.
# Usage: copy .env.example to .env, set the passwords, then `docker compose up -d`.

name: mystickcloud

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud

  app:
    image: nextcloud:${NEXTCLOUD_VERSION:-stable}-apache
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - nextcloud_data:/var/www/html
      - ../themes/mystickcloud:/var/www/html/themes/mystickcloud:ro
      - ./hooks/apply-branding.sh:/docker-entrypoint-hooks.d/before-starting/50-apply-branding.sh:ro
      - ./hooks/setup-office.sh:/docker-entrypoint-hooks.d/before-starting/60-setup-office.sh:ro
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_HOST: db
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?set NEXTCLOUD_ADMIN_PASSWORD in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      MYSTICKCLOUD_APPS_URL: ${MYSTICKCLOUD_APPS_URL:-https://mystickcloud.com}
      OFFICE_URL: ${OFFICE_URL:-http://localhost:8091/}
      OFFICE_JWT_SECRET: ${OFFICE_JWT_SECRET:?set OFFICE_JWT_SECRET in .env}
      EUROOFFICE_CONNECTOR_VERSION: ${EUROOFFICE_CONNECTOR_VERSION:-11.0.6}
    depends_on:
      - db
      - office

  # Online document editor (Euro-Office Document Server)
  office:
    image: ${OFFICE_IMAGE:-ghcr.io/euro-office/documentserver:latest}
    restart: unless-stopped
    ports:
      - "${OFFICE_PORT:-8091}:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${OFFICE_JWT_SECRET}
      # Nextcloud is reached over the internal docker network (http://app/)
      ALLOW_PRIVATE_IP_ADDRESS: "true"

volumes:
  db_data:
  nextcloud_data:
